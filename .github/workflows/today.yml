name: Today in AI

# Hourly: the finder screens new leads; when enough is waiting, Claude checks them and publishes; one draft post goes out.
# Evenings: Claude also runs a full sweep of its own.
on:
  schedule:
    - cron: "17 * * * *"
    - cron: "37 0 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "find: screen leads; sweep: Claude searches on its own too"
        type: choice
        options: [find, sweep]
        default: find

concurrency:
  group: today-in-ai
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  SWEEP: ${{ github.event.schedule == '37 0 * * *' || inputs.mode == 'sweep' }}

jobs:
  find:
    if: ${{ !(github.event.schedule == '37 0 * * *' || inputs.mode == 'sweep') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      curate: ${{ steps.finder.outputs.curate }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          ref: finder
          path: .finder-state
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: finder
        run: npx tsx scripts/automation/finder.ts
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_RUNS_PER_DAY: ${{ vars.MAX_RUNS_PER_DAY || 5 }}
          MIN_GAP_HOURS: ${{ vars.MIN_GAP_HOURS || 3 }}
      - name: Save finder state
        working-directory: .finder-state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Finder state" || exit 0
          git push -q

  curate:
    needs: find
    if: ${{ always() && (needs.find.outputs.curate == 'true' || github.event.schedule == '37 0 * * *' || inputs.mode == 'sweep') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          ref: finder
          path: .finder-state
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: prep
        run: |
          mkdir -p .finder
          cp .finder-state/candidates.json .finder/candidates.json 2>/dev/null || echo "[]" > .finder/candidates.json
          cp .finder/candidates.json "$RUNNER_TEMP/handled.json"
          echo "day=$(TZ=America/New_York date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "mode=$([ "$SWEEP" = true ] && echo sweep || echo candidates)" >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Follow .github/curate.md. Mode: ${{ steps.prep.outputs.mode }}. Today is ${{ steps.prep.outputs.day }} (US Eastern).
          claude_args: |
            --model ${{ vars.CURATE_MODEL || 'claude-opus-5-5' }}
            --max-turns 150
            --allowedTools "Read,Edit,Write,Glob,Grep,WebSearch,WebFetch,Bash(npm run validate-data)"
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_MODE: ${{ vars.PUBLISH_MODE || 'pr' }}
        run: |
          if git diff --quiet -- data posts; then echo "No changes."; exit 0; fi
          npx tsx scripts/automation/stamp.ts
          npm run validate-data
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          head -n1 .finder/summary.md > "$RUNNER_TEMP/msg" 2>/dev/null || echo "Update the Today page" > "$RUNNER_TEMP/msg"
          git add data posts
          git commit -qF "$RUNNER_TEMP/msg"
          if [ "$PUBLISH_MODE" = push ]; then
            git push -q origin HEAD:main
          else
            branch="curate/${{ github.run_id }}"
            git push -q origin "HEAD:$branch"
            gh pr create --head "$branch" --base main --title "$(cat "$RUNNER_TEMP/msg")" --body-file .finder/summary.md
          fi
      - name: Run summary
        if: always()
        run: cat .finder/summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: Settle finder state
        working-directory: .finder-state
        run: |
          ../node_modules/.bin/tsx ../scripts/automation/settle.ts "$RUNNER_TEMP/handled.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Settle candidates" || exit 0
          git push -q
        env:
          STATE_DIR: .

  post:
    needs: [find, curate]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          ref: finder
          path: .finder-state
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/automation/post.ts
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
      - name: Save posted state
        working-directory: .finder-state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Posted" || exit 0
          git push -q
